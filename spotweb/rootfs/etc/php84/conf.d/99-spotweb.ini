[general]
; Spotweb fetches images and NZB files over HTTP from within PHP, and its own
; installation check refuses to pass without this.
allow_url_fopen = On
max_execution_time = 900
memory_limit = 512M
post_max_size = 64M
upload_max_filesize = 64M
session.cookie_httponly = 1
session.use_strict_mode = 1

; Spotweb only changes on an app update, at which point the container is
; rebuilt, so timestamps never need revalidating.
opcache.enable = 1
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 16384
opcache.memory_consumption = 128
opcache.revalidate_freq = 0
opcache.validate_timestamps = 0
