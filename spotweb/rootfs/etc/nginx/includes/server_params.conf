server_name     $hostname;
root            /var/www/spotweb;
index           index.php;

add_header X-Content-Type-Options nosniff;
add_header X-Robots-Tag none;

client_max_body_size 64M;

# Spotweb ships this rewrite as an .htaccess rule for Apache. It is what
# exposes the Newznab compatible API that Sonarr, Radarr and Prowlarr talk to.
rewrite ^/api/?$ /index.php?page=newznabapi&$args last;

location / {
    try_files $uri $uri/ /index.php?$query_string;
}

location ~* \.(jpg|jpeg|png|gif|ico|css|js)$ {
    expires 365d;
}

location ~ /\.ht {
    deny all;
}

# The app sets Spotweb up by itself, so the installation wizard is never
# needed. It is the only page that reports on the PHP environment without
# asking for credentials first, so it stays closed.
location = /install.php {
    deny all;
}

# Nothing under these ever needs to be reachable over HTTP. They hold the
# library code, the bundled dependencies, the console scripts, and the cached
# NZB files and images, which Spotweb serves through index.php once it has
# checked who is asking.
location ~ ^/(bin|cache|lib|utils|vendor)/ {
    deny all;
}

location ~ ^/(dbsettings\.inc\.php|ownsettings\.php|reallymyownsettings\.php)$ {
    deny all;
}
